<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | StudySmart</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="auth-card"><h1>StudySmart</h1><h2>Create account</h2>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="message {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
<form method="POST"><label>Full name</label><input name="name" required maxlength="80"><label>Email</label><input type="email" name="email" required><label>Password (minimum 8 characters)</label><input type="password" name="password" required minlength="8"><label>Confirm password</label><input type="password" name="confirm_password" required minlength="8"><button type="submit">Register</button></form><p>Already registered? <a href="{{ url_for('login') }}">Login</a></p></main></body></html>
